name: Find live jobs

# Every Monday before the job scan (and by hand from the Actions tab), reads open jobs straight from
# each employer's hiring system and saves the possible fits to job-scan/live-jobs.json.
# Every link in that file was live when this ran; nothing comes from search engines.
on:
  schedule:
    - cron: "30 10 * * 1"   # Mondays 10:30 UTC (2:30 AM Pacific in winter, 3:30 AM in summer)
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: run just employers whose name contains this text"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: find-live-jobs
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read open jobs from each employer
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python scripts/fetch_live_jobs.py --only "${{ github.event.inputs.only }}"
          else
            python scripts/fetch_live_jobs.py
          fi
      - name: Save the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job-scan/live-jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Live jobs $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
