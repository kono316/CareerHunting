name: Check job links
 
# Runs when the Monday job scan saves a new job-scan/latest.json, or by hand from the Actions tab.
# Checks every job link live (no email is sent) and saves the results to job-scan/link-check.json,
# which the Monday scan reads back to post only working links.
on:
  push:
    branches: [main]
    paths: ["job-scan/latest.json"]
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: email-job-matches
  cancel-in-progress: false
 
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links (no email)
        run: python scripts/send_job_email.py job-scan/latest.json --check-only
      - name: Save the link check results
        if: always()
        run: |
          if [ -f job-scan/link-check.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add job-scan/link-check.json
            if ! git diff --cached --quiet; then
              git commit -m "Link check for $(python -c "import json;print(json.load(open('job-scan/latest.json')).get('date',''))")"
              git push
            fi
          fi
 
